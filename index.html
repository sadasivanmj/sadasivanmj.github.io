<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Computer</title>

  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <!-- XP.css -->
  <link rel="stylesheet" href="https://unpkg.com/xp.css">

  <!-- Your desktop styles -->
  <link rel="stylesheet" href="css/desktop.css">
</head>
<body>

  <!-- Desktop -->
  <div id="desktop">
    <div class="icon" id="articles">
      <img src="images/book.png" alt="book">
      <span>Articles</span>
    </div>
  </div>

  <!-- XP Delete Dialog -->
  <div
    class="window"
    id="deleteDialog"
    style="display:none; width:320px;"
  >
    <div class="title-bar">
      <div class="title-bar-text">System Message</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeDialog()"></button>
      </div>
    </div>

    <div class="window-body">
      <p>
        Cannot delete <strong>Articles</strong>.<br>
        The file is currently in use.
      </p>
      <section class="field-row" style="justify-content:flex-end;">
        <button onclick="closeDialog()">OK</button>
      </section>
    </div>
  </div>

  <!-- Behavior -->
  <script src="desktop.js"></script>

</body>
</html>
